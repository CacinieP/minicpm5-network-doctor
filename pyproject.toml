[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minicpm-network-doctor"
version = "0.2.0"
description = "A safe local network diagnostic agent powered by MiniCPM5 tool calling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CacinieP" }]
keywords = ["minicpm5", "network", "diagnostics", "agent", "tool-calling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]
dependencies = ["openai>=1.68"]

[project.optional-dependencies]
dev = [
  "pyyaml>=6.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
minicpm-network-doctor = "minicpm_network_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/CacinieP/minicpm5-network-doctor"
Repository = "https://github.com/CacinieP/minicpm5-network-doctor"
Issues = "https://github.com/CacinieP/minicpm5-network-doctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minicpm_network_doctor = ["system_prompt.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
