name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      - name: Validate skill
        run: |
          python /dev/stdin <<'PY'
          from pathlib import Path

          skill = Path("skills/minicpm-network-doctor/SKILL.md").read_text()
          assert skill.startswith("---\n")
          assert "\nname: minicpm-network-doctor\n" in skill
          assert "\ndescription:" in skill
          assert "TODO" not in skill
          PY
