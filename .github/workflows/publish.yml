name: Publish to PyPI

# Builds the package on every tag push (v*) and publishes to PyPI using
# Trusted Publishing (OIDC) — no long-lived API token stored as a secret.
# One-time setup required: see docs/publishing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")
          expected = tag[1:]
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = project["project"]["version"]
          init_text = Path("src/minicpm_network_doctor/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          init_version = match.group(1) if match else None
          if package_version != expected or init_version != expected:
              raise SystemExit(
                  f"tag/package version mismatch: tag={expected}, "
                  f"pyproject={package_version}, __init__={init_version}"
              )
          PY

      - name: Run release checks
        run: |
          python -m pip install -e ".[dev]" build twine
          ruff check .
          ruff format --check .
          python -m pytest --cov=minicpm_network_doctor --cov-report=term-missing

      - name: Build distributions
        run: |
          python -m build
          twine check dist/*

      - name: Verify the wheel imports and loads its prompt
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --no-deps dist/*.whl
          /tmp/verify/bin/minicpm-network-doctor --version
          /tmp/verify/bin/minicpm-network-doctor --list-tools
          /tmp/verify/bin/python -c "from minicpm_network_doctor.prompt import load_system_prompt; assert len(load_system_prompt()) > 100"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # requires a GitHub Environment named "pypi"
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
